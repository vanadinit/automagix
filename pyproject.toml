[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automagix"
version = "4.1.0"
description = "Automation wrapper for bash and python commands"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Johannes Paul", email = "vanadinit@quantentunnel.de" }
]
keywords = ["bash", "shell", "command", "automation", "process", "wrapper", "devops", "system administration"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "pyyaml>=5.1",
]

[project.urls]
Homepage = "https://codeberg.org/vanadinit/automagix"

[project.optional-dependencies]
tests = ["pytest", "pytest-docker", "flake8"]
shell_completion = ["argcomplete"]
progress_bar = ["tqdm>=4.66.0"]
bundlewrap = ["bundlewrap"]
teamvault = ["bundlewrap-teamvault"]

[project.scripts]
automagix = "automagix:main"
automagix-manager = "automagix.parallel:run_manager"
automagix-from-file = "automagix.parallel:run_auto_from_file"

[tool.setuptools]
packages = ["automagix"]
