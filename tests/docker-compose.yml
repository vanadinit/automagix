version: "3.7"
services:
  openssh-server:
    image: docker.io/linuxserver/openssh-server
    container_name: openssh-server
    hostname: openssh-server #optional
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
#      - PUBLIC_KEY= #optional
      - PUBLIC_KEY_FILE=/secrets/id_rsa_tests.pub
      - SUDO_ACCESS=true #optional
      - PASSWORD_ACCESS=false #optional
#      - USER_PASSWORD=geheim #optional
#      - USER_PASSWORD_FILE=/path/to/file #optional
      - USER_NAME=testuser #optional
    volumes:
      - ./secrets:/secrets
    ports:
      - 2222:2222
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2222 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
